---
# cPanel Git deployment for maknemy.com
#
# Only public_html/ is published. tests/, tools/, docs/ and the rest of the
# repository stay out of the web root.
#
# The copy is deliberately additive (cp, not rsync --delete): images uploaded
# through the admin panel live in public_html/images/ on the server ONLY —
# they are git-ignored, so a delete-sync would destroy them permanently.
# The trade-off is that a file deleted from the repo has to be removed from
# the server by hand.
#
# config.php is not touched: it lives one level above the web root and is
# git-ignored, so it survives every deploy.
#
# assets/, css/ and js/ go first. Pages load those files as name.js?v=N and
# .htaccess lets browsers cache such an address for a year; a page published
# before its files would let a visitor cache the old file under the new
# number. --preserve=timestamps keeps Last-Modified of unchanged files stable,
# so revalidation after a deploy still answers 304. This is the manual
# fallback: the webhook (public_html/api/deploy.php) does the same in PHP and
# additionally never rewrites identical files and swaps changed ones
# atomically.
deployment:
  tasks:
    - export DEPLOYPATH=/home/maknemyt/public_html
    - /bin/cp -R --preserve=timestamps public_html/assets public_html/css public_html/js $DEPLOYPATH/
    - /bin/cp -R --preserve=timestamps public_html/. $DEPLOYPATH/
